<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pi Team · Blackboard</title>
  <style>
    :root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#e4e9f1;background:#10141d;font-synthesis:none;line-height:1.6}
    *{box-sizing:border-box}body{margin:0}main,.shell{max-width:1280px;margin:auto;padding:0 32px}
    header{border-bottom:1px solid #2a3242;padding:32px 0 25px;background:#141a25}.eyebrow{color:#a6b4cf;font-size:12px;letter-spacing:.16em;font-weight:600;margin:0 0 8px}
    h1{font-size:30px;letter-spacing:-.025em;line-height:1.3;margin:0}h1 span{color:#929fb7;font-weight:400}p{margin:0}.subtitle{color:#abb6ca;font-size:14px;margin-top:10px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;color:#aeb9cc;font-size:13px;flex-wrap:wrap}.toolbar strong{color:#e4e9f1;font-weight:500}#refresh-state{font-variant-numeric:tabular-nums}
    #error{margin:0 0 22px;border:1px solid #795834;background:#2c241b;padding:14px 18px;color:#f5ce97;border-radius:9px;font-size:14px}#error[hidden]{display:none}
    .group{border:1px solid #303a4d;background:#171e2b;border-radius:14px;padding:24px;margin-bottom:24px;overflow:hidden}.group-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.group h2{font-size:20px;line-height:1.4;margin:0 0 4px;font-weight:600}.group-id{font-size:12px;color:#a4b1c8;font-family:ui-monospace,Consolas,monospace}.group-labels{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;border:1px solid #394459;background:#202a3a;color:#b9c7df;font-size:12px;padding:3px 9px;white-space:nowrap}.badge.good{background:#162e28;border-color:#285246;color:#99d8b6}.badge.warn{background:#332b1c;border-color:#685530;color:#e8c688}.badge.off{color:#b1bdcf;background:#252d3b}.badge.fault{background:#38252c;border-color:#774653;color:#ffb4b4}
    .roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.role{background:#111824;border:1px solid #2c374b;border-radius:10px;padding:18px;min-width:0}.role-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.role h3{font-size:15px;margin:0;font-weight:600}.role-heading small{display:block;color:#8e9db5;font-size:11px;margin-top:1px}.model{font-size:15px;overflow-wrap:anywhere;font-weight:500}.provider{font-size:11px;color:#8f9eb8;font-family:ui-monospace,Consolas,monospace;min-height:18px}.activity-label{color:#a8b6cc;font-size:11px;margin-top:22px;margin-bottom:7px}.activity{font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;min-height:65px;max-height:240px;overflow:auto;color:#d4dce9}.activity.empty{color:#8e9bb1}.activity-time{font-size:11px;color:#8e9bb1;margin-top:10px;font-variant-numeric:tabular-nums}.fault-text{margin-top:14px;border-top:1px solid #513640;padding-top:12px;color:#ffb4b4;font-size:12px;overflow-wrap:anywhere}.process-note{margin-top:10px;font-size:11px;color:#a3afc1}
    details{margin-top:18px;border-top:1px solid #2b3547;padding-top:13px}summary{cursor:pointer;color:#aebbd1;font-size:13px;width:fit-content}summary:hover{color:#e9eff9}.description{white-space:pre-wrap;overflow-wrap:anywhere;color:#acb9ce;font-size:13px;line-height:1.9;margin-top:14px}.empty-state{border:1px dashed #384357;border-radius:12px;padding:45px 25px;text-align:center;color:#b2bfd4}.invalid{color:#ffb4b4;font-size:14px}.footnote{color:#8e9bb1;font-size:12px;padding:0 0 35px}.count{color:#e5eaf3}
    @media(max-width:850px){.roles{grid-template-columns:1fr}.activity{min-height:0}.group{padding:18px}main,.shell{padding-left:18px;padding-right:18px}.group-head{flex-direction:column}.group-labels{justify-content:flex-start}h1{font-size:25px}.toolbar{gap:8px}}
  </style>
</head>
<body>
  <header><div class="shell"><p class="eyebrow">PI TEAM / OBSERVATORY</p><h1>Blackboard <span>· 角色状态</span></h1><p class="subtitle">只读观察。打开页面不会启动角色或调用模型。</p></div></header>
  <main>
    <div class="toolbar"><strong id="group-count">正在读取小组…</strong><span id="refresh-state" role="status" aria-live="polite">等待首次刷新</span></div>
    <div id="error" role="alert" hidden></div>
    <section id="groups" aria-label="小组与角色"></section>
    <p class="footnote">最近活动来自角色的结构化输出，不代表正式提交或任务完成。模型信息来自实际会话记录。</p>
  </main>
  <script type="module" src="/client.mjs"></script>
</body>
</html>
